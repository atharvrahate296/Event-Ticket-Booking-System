{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Edit Offer</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Promo Code</label>
                            <input type="text" name="promo_code" class="form-control text-uppercase" 
                                   value="{{ offer.promo_code }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Discount Type</label>
                            <select name="discount_type" class="form-select">
                                <option value="Percentage" {% if offer.discount_type == 'Percentage' %}selected{% endif %}>Percentage (%)</option>
                                <option value="Flat" {% if offer.discount_type == 'Flat' %}selected{% endif %}>Flat Amount (₹)</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Discount Value</label>
                            <input type="number" step="0.01" name="discount_value" class="form-control" 
                                   value="{{ offer.discount_value }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Max Discount (Optional)</label>
                            <input type="number" step="0.01" name="max_discount" class="form-control" 
                                   value="{{ offer.max_discount if offer.max_discount else '' }}">
                            <small class="text-muted">Only for percentage based offers</small>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Valid From</label>
                            <input type="date" name="valid_from" class="form-control" 
                                   value="{{ offer.valid_from }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Valid To</label>
                            <input type="date" name="valid_to" class="form-control" 
                                   value="{{ offer.valid_to }}" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="2" required>{{ offer.description }}</textarea>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Update Offer</button>
                        <a href="{{ url_for('admin_offers') }}" class="btn btn-light">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
