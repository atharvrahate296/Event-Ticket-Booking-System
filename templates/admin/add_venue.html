<!-- templates/admin/add_venue.html -->
{% extends 'base.html' %}

{% block content %}
<h1 class="mb-4">Add Venue</h1>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Venue Name</label>
                    <input type="text" name="venue_name" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">City</label>
                    <input type="text" name="city" class="form-control" required>
                </div>
                <div class="col-md-12 mb-3">
                    <label class="form-label">Address</label>
                    <textarea name="address" class="form-control" rows="2" required></textarea>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Total Seats</label>
                    <input type="number" name="total_seats" class="form-control" required>
                </div>
                <div class="col-md-6"></div>
                
                <div class="col-md-12"><h5 class="mt-3 mb-3">Seat Configuration</h5></div>
                
                <div class="col-md-3 mb-3">
                    <label class="form-label">Silver Seats</label>
                    <input type="number" name="silver_seats" class="form-control" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Silver Price (₹)</label>
                    <input type="number" step="0.01" name="silver_price" class="form-control" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Gold Seats</label>
                    <input type="number" name="gold_seats" class="form-control" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Gold Price (₹)</label>
                    <input type="number" step="0.01" name="gold_price" class="form-control" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Platinum Seats</label>
                    <input type="number" name="platinum_seats" class="form-control" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Platinum Price (₹)</label>
                    <input type="number" step="0.01" name="platinum_price" class="form-control" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">VIP Seats</label>
                    <input type="number" name="vip_seats" class="form-control" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">VIP Price (₹)</label>
                    <input type="number" step="0.01" name="vip_price" class="form-control" required>
                </div>
            </div>
            <button type="submit" class="btn btn-gradient">Add Venue</button>
            <a href="{{ url_for('admin_venues') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
