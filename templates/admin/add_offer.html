<!-- templates/admin/add_offer.html -->
{% extends 'base.html' %}

{% block content %}
<h1 class="mb-4">Add Offer</h1>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Promo Code</label>
                    <input type="text" name="promo_code" class="form-control" style="text-transform: uppercase;" required>
                    <small class="text-muted">Will be converted to uppercase</small>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Discount Type</label>
                    <select name="discount_type" class="form-select" id="discountType" required>
                        <option value="Percentage">Percentage</option>
                        <option value="Fixed">Fixed Amount</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Discount Value</label>
                    <input type="number" step="0.01" name="discount_value" class="form-control" required>
                    <small class="text-muted" id="discountHint">Enter percentage (e.g., 20 for 20%)</small>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Max Discount (₹)</label>
                    <input type="number" step="0.01" name="max_discount" class="form-control" placeholder="Optional">
                    <small class="text-muted">Leave empty for no limit</small>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Valid From</label>
                    <input type="date" name="valid_from" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Valid To</label>
                    <input type="date" name="valid_to" class="form-control" required>
                </div>
                <div class="col-md-12 mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="2" required></textarea>
                </div>
            </div>
            <button type="submit" class="btn btn-gradient">Add Offer</button>
            <a href="{{ url_for('admin_offers') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

<script>
document.getElementById('discountType').addEventListener('change', function() {
    const hint = document.getElementById('discountHint');
    if (this.value === 'Percentage') {
        hint.textContent = 'Enter percentage (e.g., 20 for 20%)';
    } else {
        hint.textContent = 'Enter fixed amount in rupees (e.g., 100 for ₹100)';
    }
});
</script>
{% endblock %}
