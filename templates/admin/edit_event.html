<!-- templates/admin/edit_event.html -->
{% extends 'base.html' %}

{% block content %}
<h1 class="mb-4">Edit Event</h1>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Event Name</label>
                    <input type="text" name="event_name" class="form-control" value="{{ event.event_name }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Category</label>
                    <select name="category" class="form-select" required>
                        <option value="Concert" {% if event.category == 'Concert' %}selected{% endif %}>Concert</option>
                        <option value="Musical" {% if event.category == 'Musical' %}selected{% endif %}>Musical</option>
                        <option value="Comedy" {% if event.category == 'Comedy' %}selected{% endif %}>Comedy</option>
                        <option value="Sports" {% if event.category == 'Sports' %}selected{% endif %}>Sports</option>
                        <option value="Theatre" {% if event.category == 'Theatre' %}selected{% endif %}>Theatre</option>
                        <option value="Classical" {% if event.category == 'Classical' %}selected{% endif %}>Classical</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Language</label>
                    <input type="text" name="language" class="form-control" value="{{ event.language }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Duration (minutes)</label>
                    <input type="number" name="duration" class="form-control" value="{{ event.duration }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Age Rating</label>
                    <select name="age_rating" class="form-select" required>
                        <option value="U" {% if event.age_rating == 'U' %}selected{% endif %}>U (Universal)</option>
                        <option value="A" {% if event.age_rating == 'A' %}selected{% endif %}>A (Adult)</option>
                        <option value="UA" {% if event.age_rating == 'UA' %}selected{% endif %}>UA (Parental Guidance)</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Venue</label>
                    <select name="venue_id" class="form-select" required>
                        {% for venue in venues %}
                        <option value="{{ venue.venue_id }}" {% if venue.venue_id == event.venue_id %}selected{% endif %}>
                            {{ venue.venue_name }} - {{ venue.city }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Start Date</label>
                    <input type="date" name="start_date" class="form-control" value="{{ event.start_date }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">End Date</label>
                    <input type="date" name="end_date" class="form-control" value="{{ event.end_date }}" required>
                </div>
                <div class="col-md-12 mb-3">
                    <label class="form-label">Poster URL</label>
                    <input type="url" name="poster_url" class="form-control" value="{{ event.poster_url }}" required>
                </div>
                <div class="col-md-12 mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="3" required>{{ event.description }}</textarea>
                </div>
                <div class="col-md-12 mb-3">
                    <div class="form-check">
                        <input type="checkbox" name="is_featured" class="form-check-input" {% if event.is_featured %}checked{% endif %}>
                        <label class="form-check-label">Mark as Featured</label>
                    </div>
                </div>
                <div class="col-md-12 mb-3">
                    <div class="form-check">
                        <input type="checkbox" name="is_active" class="form-check-input" {% if event.is_active %}checked{% endif %}>
                        <label class="form-check-label">Active</label>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-gradient">Update Event</button>
            <a href="{{ url_for('admin_events') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
